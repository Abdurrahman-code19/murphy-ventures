<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a cheque writing machine">
  <g fill="none" stroke="#153B75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="506" rx="236" ry="24" fill="#091B3B" opacity=".06" stroke="none"/>
    <!-- cheque emerging -->
    <g transform="rotate(-5 300 220)">
      <rect x="150" y="140" width="290" height="150" rx="4" fill="#fff"/>
      <rect x="166" y="156" width="258" height="118" rx="2" fill="#F7F6F2" stroke-width="2"/>
      <path d="M184 178h96M184 202h62" stroke-width="2" opacity=".5"/>
      <path d="M184 240h180" stroke-width="2" opacity=".35"/>
      <path d="M300 182c18-12 26 14 44 0s24 14 40 2" stroke="#C49A45" stroke-width="3"/>
      <rect x="302" y="222" width="98" height="28" rx="3" stroke="#C49A45" stroke-width="2"/>
    </g>
    <!-- machine body -->
    <path d="M196 288h348l32 44H180z" fill="#fff"/>
    <rect x="180" y="332" width="400" height="148" rx="16" fill="#fff"/>
    <path d="M180 366h400" opacity=".3"/>
    <!-- display -->
    <rect x="212" y="350" width="156" height="40" rx="6" fill="#091B3B" stroke="none"/>
    <path d="M228 372h40M282 372h46" stroke="#C49A45" stroke-width="5"/>
    <!-- keyboard -->
    <g fill="#F7F6F2" stroke-width="2">
      <rect x="212" y="408" width="36" height="22" rx="3"/>
      <rect x="256" y="408" width="36" height="22" rx="3"/>
      <rect x="300" y="408" width="36" height="22" rx="3"/>
      <rect x="344" y="408" width="36" height="22" rx="3"/>
      <rect x="388" y="408" width="36" height="22" rx="3"/>
      <rect x="432" y="408" width="72" height="22" rx="3"/>
      <rect x="212" y="438" width="132" height="22" rx="3"/>
      <rect x="352" y="438" width="152" height="22" rx="3"/>
    </g>
    <!-- cheque slot -->
    <path d="M480 288h44l14 20h-72z" fill="#F7F6F2"/>
    <path d="M466 308h72" stroke="#C49A45" stroke-width="3"/>
    <!-- side wheel -->
    <circle cx="536" cy="392" r="20" fill="#F7F6F2"/>
    <circle cx="536" cy="392" r="6" fill="#C49A45" stroke="none"/>
    <!-- feet -->
    <path d="M212 480v12M548 480v12"/>
    <g stroke-width="2" opacity=".4">
      <path d="M624 288v192M616 288h16M616 480h16"/>
      <path d="M644 128h24M656 116v24"/>
    </g>
  </g>
  <g fill="#153B75" opacity=".8" font-family="Manrope, system-ui, sans-serif" font-size="15" letter-spacing="3">
    <text x="624" y="536">CHEQUE HANDLING</text>
  </g>
</svg>
