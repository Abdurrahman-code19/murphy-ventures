<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a counterfeit money detector">
  <g fill="none" stroke="#153B75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="512" rx="236" ry="24" fill="#091B3B" opacity=".06" stroke="none"/>
    <!-- note being checked -->
    <g transform="rotate(-4 380 392)">
      <rect x="196" y="336" width="330" height="132" rx="8" fill="#fff"/>
      <rect x="216" y="356" width="290" height="92" rx="4" fill="#F7F6F2" stroke-width="2"/>
      <circle cx="300" cy="402" r="26" stroke-width="2" opacity=".6"/>
      <path d="M352 380h120M352 400h96M352 420h130" stroke-width="2" opacity=".45"/>
      <path d="M474 356v92" stroke="#C49A45" stroke-width="3" opacity=".7"/>
    </g>
    <!-- detector hood -->
    <path d="M250 300h252l24 36H226z" fill="#fff"/>
    <path d="M226 336h300" stroke="#C49A45" stroke-width="4"/>
    <rect x="300" y="256" width="152" height="44" rx="10" fill="#fff"/>
    <rect x="318" y="272" width="48" height="12" rx="6" fill="#091B3B" stroke="none"/>
    <circle cx="420" cy="278" r="7" fill="#C49A45" stroke="none"/>
    <!-- UV rays -->
    <g stroke="#C49A45" stroke-width="2.5" stroke-dasharray="5 9" opacity=".85">
      <path d="M276 344l-22 46M330 344l-10 54M386 344v58M442 344l10 54M496 344l22 46"/>
    </g>
    <!-- magnifier -->
    <g transform="translate(560 236)">
      <circle cx="0" cy="0" r="72" fill="#fff" fill-opacity=".85"/>
      <circle cx="0" cy="0" r="72" stroke="#153B75"/>
      <circle cx="0" cy="0" r="58" stroke-width="2" opacity=".4"/>
      <path d="M51 51 96 96" stroke-width="8"/>
      <path d="M-24 4l18 18 34-40" stroke="#C49A45" stroke-width="5"/>
    </g>
    <!-- scan grid on note -->
    <g opacity=".25" stroke-width="2">
      <path d="M240 352h150M240 372h150M240 392h150M240 412h150M240 432h150"/>
    </g>
    <g stroke-width="2" opacity=".4">
      <path d="M160 176h30M175 161v30"/>
      <path d="M660 456h20M670 446v20"/>
    </g>
  </g>
  <g fill="#153B75" opacity=".8" font-family="Manrope, system-ui, sans-serif" font-size="15" letter-spacing="3">
    <text x="160" y="536">NOTE VERIFICATION</text>
  </g>
</svg>
