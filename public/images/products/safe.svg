<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a fireproof safe">
  <g fill="none" stroke="#153B75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="504" rx="238" ry="26" fill="#091B3B" opacity=".06" stroke="none"/>
