    <rect x="212" y="200" width="334" height="322" rx="14" fill="#fff"/>
    <rect x="236" y="224" width="286" height="274" rx="8" fill="#F7F6F2"/>
    <!-- door inset -->
    <rect x="260" y="248" width="238" height="226" rx="6" fill="#fff"/>
    <!-- hinges -->
    <g fill="#153B75" stroke="none">
      <rect x="250" y="286" width="10" height="46" rx="5"/>
      <rect x="250" y="392" width="10" height="46" rx="5"/>
    </g>
    <!-- dial -->
    <circle cx="402" cy="332" r="58" fill="#fff"/>
    <circle cx="402" cy="332" r="40" fill="#F7F6F2" stroke="#C49A45" stroke-width="4"/>
    <circle cx="402" cy="332" r="8" fill="#C49A45" stroke="none"/>
    <path d="M402 332l26-28" stroke="#C49A45" stroke-width="5"/>
    <g opacity=".55" stroke-width="2">
