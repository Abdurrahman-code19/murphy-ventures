<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a time recording machine">
  <g fill="none" stroke="#153B75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="400" cy="500" rx="230" ry="24" fill="#091B3B" opacity=".06" stroke="none"/>
    <!-- wall clock watermark -->
    <g opacity=".35">
      <circle cx="596" cy="196" r="104"/>
      <path d="M596 196v-58M596 196l40 24"/>
      <circle cx="596" cy="196" r="5" fill="#C49A45" stroke="none"/>
      <path d="M596 104v-12M688 196h12M596 288v12M504 196h-12"/>
    </g>
    <!-- time card -->
    <g>
      <rect x="238" y="196" width="262" height="150" rx="4" fill="#fff" transform="rotate(-6 369 271)"/>
      <g transform="rotate(-6 369 271)" opacity=".5" stroke-width="2">
        <path d="M258 226h150M258 252h108M258 278h178M258 304h130"/>
      </g>
      <circle cx="452" cy="300" r="16" fill="#C49A45" opacity=".25" stroke="#C49A45"/>
    </g>
    <!-- device -->
    <rect x="190" y="286" width="360" height="188" rx="18" fill="#fff"/>
    <path d="M190 338h360" opacity=".35"/>
    <!-- display -->
    <rect x="222" y="312" width="170" height="54" rx="6" fill="#091B3B" stroke="none"/>
    <g fill="#C49A45" stroke="none">
      <rect x="238" y="328" width="12" height="22" rx="2"/>
      <rect x="258" y="328" width="12" height="22" rx="2"/>
      <rect x="286" y="328" width="6" height="22" rx="3"/>
      <rect x="302" y="328" width="12" height="22" rx="2"/>
      <rect x="322" y="328" width="12" height="22" rx="2"/>
      <rect x="350" y="328" width="6" height="22" rx="3"/>
      <rect x="366" y="328" width="12" height="22" rx="2"/>
    </g>
    <!-- keypad -->
    <g fill="#F7F6F2" stroke="#153B75" stroke-width="2">
      <rect x="420" y="312" width="34" height="24" rx="4"/>
      <rect x="462" y="312" width="34" height="24" rx="4"/>
      <rect x="504" y="312" width="34" height="24" rx="4"/>
      <rect x="420" y="344" width="34" height="24" rx="4"/>
      <rect x="462" y="344" width="34" height="24" rx="4"/>
      <rect x="504" y="344" width="34" height="24" rx="4"/>
    </g>
    <!-- card slot -->
    <rect x="222" y="394" width="258" height="18" rx="9" fill="#F7F6F2"/>
    <path d="M222 403h258" stroke="#C49A45" stroke-width="4"/>
    <!-- card entering -->
    <path d="M304 424h150l6 28H298z" fill="#fff"/>
    <path d="M318 438h96M318 446h66" stroke-width="2" opacity=".5"/>
    <!-- feet -->
    <path d="M226 474v16M514 474v16"/>
    <g stroke-width="2" opacity=".4">
      <path d="M572 286v188M564 286h16M564 474h16"/>
      <path d="M120 200h26M133 187v26"/>
    </g>
  </g>
  <g fill="#153B75" opacity=".8" font-family="Manrope, system-ui, sans-serif" font-size="15" letter-spacing="3">
    <text x="120" y="536">TIME RECORDING</text>
  </g>
</svg>
